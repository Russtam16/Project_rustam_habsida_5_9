<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FirstProjectRustam</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="project_rustam_habsida_5.9.css">
</head>
<body>
    <main class="menu">
        <aside class="sidebar">
            <header class="sidebar-header">
                <a href="https://google.com" class="google" target="_blank">
                    <img src="logo.svg" alt="iintoo logo" class="iintoo-logo">
                </a>
            </header>
        </aside>

        <section class="form-section">
            <div class="div-section">
                <div class="header-group">
                    <h1>Get iinto it today</h1>
                    <p class="paragraf">There is no charge or obligation upon registration.</p>
                </div>

                <div class="social-buttons">
                    <button class="btn-social btn-facebook" type="button">
                        <img src="facebook.svg" alt="Facebook" class="social-icon">
                        <span>Register with Facebook</span>
                    </button>
                    <button class="btn-social btn-linkedin" type="button">
                        <img src="linkedin.svg" alt="LinkedIn" class="social-icon">
                        <span>Register with LinkedIn</span>
                    </button>
                </div>

                <div class="or">
                    <span>OR</span>
                </div>

                <form action="#" class="registration-form">
                    <div class="inputs">
                        <div class="input-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" placeholder="gus.goodwin@gmail.com">
                        </div>
                        <div class="input-group">
                            <label for="phone">Phone</label>
                            <input type="tel" id="phone" placeholder="">
                        </div>
                    </div>

                    <div class="investor-section">
                        <h2>What type of investor are you?</h2>
                        <p class="investor-subtitle">Select the type of investor you are below.</p>
                        
                        <div class="radiogroup">
                            <label class="radio-label">
                                <input type="radio" name="investor_type" value="Individual" checked>
                                <span>Individual</span>
                                <span class="info-icon">i</span>
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="investor_type" value="Business">
                                <span>Business</span>
                                <span class="info-icon">i</span>
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="investor_type" value="IRA">
                                <span>IRA</span>
                                <span class="info-icon">i</span>
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="investor_type" value="Trust">
                                <span>Trust</span>
                                <span class="info-icon">i</span>
                            </label>
                        </div>
                    </div>

                    <div class="investor-info-box">
                        <p>I am natural person investing on my own behalf, as a sole owner, joint tenant, or tenant in common.</p>
                    </div>

                    <div class="checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" required>
                            <span>I agree to the terms and receiving notifications from iintoo <a href="https://google.com" class="terms-link" target="_blank">View full terms</a></span>
                        </label>
                    </div>

                    <button class="submit-btn" type="submit">Create Account</button>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
